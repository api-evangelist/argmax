apis:
- name: Argmax Local Server
  description: >-
    A local transcription server for macOS that is API-compatible with the
    Deepgram Speech-to-Text (Live) API, exposing a WebSocket streaming interface
    (default ws://localhost:50060) driven by the official @argmaxinc/local-server
    Node client. Authenticated with an Argmax API key (ax_ prefix); a Python
    client is documented as coming soon.
  humanURL: https://app.argmaxinc.com/docs/guides/using-local-server
  baseURL: ws://localhost:50060
