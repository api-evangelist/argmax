aid: argmax
name: Argmax
description: >-
  Argmax, Inc. builds on-device inference infrastructure that lets developers
  run foundation models locally on user devices for privacy, real-time
  performance, and predictable per-device costs. Its products are commercial Pro
  SDKs on top of open-source cores: WhisperKit (speech-to-text with file
  transcription, real-time streaming, word timestamps, and subtitle export),
  SpeakerKit (speaker recognition, diarization, and voice-activity detection),
  DiffusionKit (image generation for Flux.1 and Stable Diffusion on Apple
  Silicon), and TTSKit. Argmax also ships the Argmax Local Server for macOS, a
  local transcription server that is API-compatible with the Deepgram
  Speech-to-Text (Live) API and driven by an official Node client
  (@argmaxinc/local-server). Devices are licensed through the ArgmaxSDK
  (ax_-prefixed API keys) with device-based billing measured by unique
  licenseId. Backed by General Catalyst.
